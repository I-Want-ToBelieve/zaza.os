name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L
      - run: nix build .#krohnkite -L
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install Qt 6 runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qml-qt6 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-models qml6-module-qtqml-workerscript
      - name: Smoke test the Effect bundle in Qt QV4
        if: runner.os == 'Linux'
        run: bash scripts/qt-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krohnkite-${{ matrix.os }}
          path: |
            dist/*.kwinscript
            dist/*.source.zip
            dist/*.js
            dist/*.map
            dist/*.json
            dist/SHA256SUMS
          if-no-files-found: error
