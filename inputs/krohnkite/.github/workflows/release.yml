name: Release KWin assets
on:
  push:
    tags: ['v*', '@krohnkite/kwin@*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (vVERSION or @krohnkite/kwin@VERSION)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NX_DAEMON: 'false'
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install Qt 6 runtime
        run: sudo apt-get update && sudo apt-get install -y qml-qt6 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-models qml6-module-qtqml-workerscript
      - name: Smoke test the Effect bundle in Qt QV4
        run: bash scripts/qt-smoke.sh
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Verify Nix source package and Qt runtime
        run: nix flake check -L
      - name: Create or update GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.kwinscript dist/*.source.zip dist/*.js dist/*.map dist/*.json dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.kwinscript dist/*.source.zip dist/*.js dist/*.map dist/*.json dist/SHA256SUMS --verify-tag --generate-notes --title "Krohnkite ${RELEASE_TAG}"
          fi
